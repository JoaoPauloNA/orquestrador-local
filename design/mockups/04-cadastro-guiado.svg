<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" fill="none">
  <defs>
    <style>
      .window-border { stroke: #cbd5e1; stroke-width: 1; }
      .sheet-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; rx: 12; }
      .input-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 6; }
      .input-valid { fill: #f0fdf4; stroke: #86efac; stroke-width: 1; rx: 6; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
      .text-desc { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 11px; fill: #64748b; }
      .text-input { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Menlo, monospace; font-size: 12px; fill: #0f172a; }
      .watermark { font-family: -apple-system, BlinkMacSystemFont, "SF Pro", monospace; font-size: 10px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.08em; }
      .btn-primary { fill: #0f172a; rx: 6; }
      .btn-secondary { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 6; }
    </style>
    <filter id="shadow" x="-5%" y="-2%" width="110%" height="106%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Window Frame -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="840" height="560" rx="12" fill="#f8fafc" class="window-border" />
  </g>

  <!-- Window Titlebar -->
  <path d="M 20 32 A 12 12 0 0 1 32 20 L 848 20 A 12 12 0 0 1 860 32 L 860 68 L 20 68 Z" fill="#e2e8f0" fill-opacity="0.6" />
  <line x1="20" y1="68" x2="860" y2="68" stroke="#cbd5e1" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="42" cy="44" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="62" cy="44" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="82" cy="44" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />
  <text x="440" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif" font-size="13px" font-weight="600" fill="#475569">Cadastrar Novo Serviço Local</text>

  <!-- Centered Modal Sheet (620x460 px) -->
  <g transform="translate(130, 90)">
    <rect width="620" height="450" class="sheet-bg" />

    <!-- Sheet Header -->
    <g transform="translate(32, 28)">
      <text x="0" y="0" class="text-title">Registro Guiado de Serviço</text>
      <text x="0" y="18" class="text-desc">Cadastre um serviço local para criar ou adotar um LaunchAgent no domínio do usuário.</text>
    </g>

    <!-- Field 1: Perfil de Execução (Segmented Selector) -->
    <g transform="translate(32, 74)">
      <text x="0" y="0" class="text-label">1. Perfil de Execução:</text>
      <!-- Option 1 (Selected) -->
      <g transform="translate(0, 10)">
        <rect width="176" height="42" rx="6" fill="#0284c7" fill-opacity="0.08" stroke="#0284c7" stroke-width="1.5" />
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif" font-size="11.5px" font-weight="700" fill="#0284c7">● ML Local (PyTorch/uv)</text>
      </g>
      <!-- Option 2 -->
      <g transform="translate(186, 10)">
        <rect width="176" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif" font-size="11.5px" font-weight="500" fill="#334155">○ API Python / FastAPI</text>
      </g>
      <!-- Option 3 -->
      <g transform="translate(372, 10)">
        <rect width="184" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif" font-size="11.5px" font-weight="500" fill="#334155">○ Servidor Web Genérico</text>
      </g>
    </g>

    <!-- Field 2: Nome do Projeto -->
    <g transform="translate(32, 150)">
      <text x="0" y="0" class="text-label">2. Nome do Serviço / Identificador:</text>
      <rect x="0" y="8" width="556" height="34" class="input-box" />
      <text x="14" y="30" class="text-input">mflux-studio</text>
      <text x="0" y="54" class="text-desc">Identificador interno e prefixo de label do LaunchAgent (ex: local.mflux-studio)</text>
    </g>

    <!-- Field 3: Diretório Raiz com Validação Inline -->
    <g transform="translate(32, 224)">
      <text x="0" y="0" class="text-label">3. Diretório Raiz do Projeto:</text>
      <g transform="translate(0, 8)">
        <rect width="436" height="34" class="input-valid" />
        <text x="14" y="22" class="text-input">/Users/joaopaulo/Documents/Projetos/Carreira/mflux-studio</text>
        
        <!-- Directory Picker Button -->
        <g transform="translate(446, 0)">
          <rect width="110" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
          <text x="55" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif" font-size="11.5px" font-weight="600" fill="#0f172a">Selecionar...</text>
        </g>
      </g>

      <!-- Inline Validation Badge: VÁLIDO -->
      <g transform="translate(0, 50)">
        <circle cx="6" cy="8" r="4.5" fill="#059669" />
        <text x="16" y="11" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif" font-size="11px" font-weight="600" fill="#059669">VÁLIDO</text>
        <text x="64" y="11" class="text-desc">— Executável `server.py` e ambiente virtual `.venv` detectados.</text>
      </g>
    </g>

    <!-- Field 4: Porta e Prontidão -->
    <g transform="translate(32, 304)">
      <text x="0" y="0" class="text-label">4. Porta Local &amp; Endpoint de Prontidão:</text>
      <g transform="translate(0, 8)">
        <rect width="120" height="34" class="input-box" />
        <text x="14" y="22" class="text-input">8765</text>
        
        <rect x="130" y="0" width="426" height="34" class="input-box" />
        <text x="144" y="22" class="text-input">http://127.0.0.1:8765/health</text>
      </g>
      <g transform="translate(0, 50)">
        <circle cx="6" cy="8" r="4.5" fill="#059669" />
        <text x="16" y="11" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif" font-size="11px" font-weight="600" fill="#059669">PORTA LIVRE</text>
        <text x="96" y="11" class="text-desc">— Nenhuma colisão detectada no Mac.</text>
      </g>
    </g>

    <!-- Footer Actions (Cancelar e Salvar) -->
    <g transform="translate(32, 388)">
      <line x1="0" y1="0" x2="556" y2="0" stroke="#e2e8f0" stroke-width="1" />
      <g transform="translate(340, 16)">
        <!-- Cancelar -->
        <rect x="0" y="0" width="88" height="32" class="btn-secondary" />
        <text x="44" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif" font-size="12px" font-weight="500" fill="#475569">Cancelar</text>

        <!-- Salvar Serviço -->
        <rect x="98" y="0" width="118" height="32" class="btn-primary" />
        <text x="157" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif" font-size="12px" font-weight="600" fill="#ffffff">Salvar Serviço</text>
      </g>
    </g>
  </g>

  <!-- Mandatory Concept Watermark -->
  <text x="840" y="565" text-anchor="end" class="watermark">CONCEITO / DADOS SINTÉTICOS</text>
</svg>
