<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" width="420" height="520" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif">
  <defs>
    <!-- macOS Popover Shadow -->
    <filter id="popoverShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Simulated macOS Menu Bar (Top strip) -->
  <rect x="0" y="0" width="420" height="28" fill="#e2e8f0"/>
  <!-- Status Items simulated in menu bar -->
  <text x="20" y="18" font-size="12" font-weight="600" fill="#0f172a">Dom 10:01</text>
  <g transform="translate(190, 6)" fill="none" stroke="#0f172a" stroke-width="1.5">
    <!-- Menu bar icon active indicator -->
    <circle cx="9" cy="8" r="7"/>
    <circle cx="9" cy="8" r="2.5" fill="#0f172a"/>
  </g>

  <!-- Popover Container with Anchor Arrow -->
  <g transform="translate(30, 28)" filter="url(#popoverShadow)">
    <!-- Anchor Triangle -->
    <polygon points="170,0 180,-8 190,0" fill="#ffffff"/>
    
    <!-- Main Popover Window (360 x 440) -->
    <rect x="0" y="0" width="360" height="440" rx="14" ry="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Popover Header -->
    <g transform="translate(18, 20)">
      <!-- Brand icon mini -->
      <circle cx="10" cy="10" r="10" fill="#0f172a"/>
      <circle cx="10" cy="10" r="3" fill="#059669"/>
      
      <text x="28" y="14" font-size="14" font-weight="700" fill="#0f172a">Orquestrador Local</text>
      <text x="280" y="14" font-size="11" font-weight="600" fill="#059669" text-anchor="end">1 Ativo · 1 Parado</text>
    </g>

    <!-- Divider -->
    <line x1="16" y1="46" x2="344" y2="46" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Service Item 1: mflux-studio -->
    <g transform="translate(16, 56)">
      <rect width="328" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- State Indicator Pill -->
      <circle cx="20" cy="22" r="5" fill="#059669"/>
      <text x="32" y="26" font-size="13" font-weight="700" fill="#0f172a">mflux-studio</text>
      
      <!-- State badge -->
      <rect x="240" y="12" width="76" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="278" y="26" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">Pronto</text>

      <!-- Port & Memory line -->
      <text x="32" y="46" font-size="11" font-weight="400" fill="#64748b" font-family="ui-monospace, Menlo, monospace">:8080 · 2.4 GB estimados</text>

      <!-- Action Buttons -->
      <g transform="translate(16, 64)">
        <!-- Parar -->
        <g>
          <rect width="68" height="24" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          <rect x="8" y="7" width="10" height="10" rx="1" fill="#dc2626"/>
          <text x="24" y="16" font-size="11" font-weight="600" fill="#0f172a">Parar</text>
        </g>

        <!-- Abrir -->
        <g transform="translate(76, 0)">
          <rect width="68" height="24" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          <g transform="translate(8, 5)" fill="none" stroke="#0284c7" stroke-width="1.5">
            <path d="M8 6v3a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h3"/>
            <polyline points="7 1 10 1 10 4"/>
            <line x1="4" y1="7" x2="10" y2="1"/>
          </g>
          <text x="24" y="16" font-size="11" font-weight="600" fill="#0f172a">Abrir</text>
        </g>

        <!-- Detalhes -->
        <g transform="translate(216, 0)">
          <rect width="80" height="24" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="40" y="16" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Detalhes</text>
        </g>
      </g>
    </g>

    <!-- Service Item 2: ComfyUI -->
    <g transform="translate(16, 178)">
      <rect width="328" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      
      <!-- State Indicator Pill -->
      <circle cx="20" cy="22" r="5" fill="#94a3b8"/>
      <text x="32" y="26" font-size="13" font-weight="700" fill="#0f172a">ComfyUI</text>
      
      <!-- State badge -->
      <rect x="240" y="12" width="76" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <text x="278" y="26" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">Parado</text>

      <!-- Port & Memory line -->
      <text x="32" y="46" font-size="11" font-weight="400" fill="#64748b" font-family="ui-monospace, Menlo, monospace">:8188 · Inativo</text>

      <!-- Action Buttons -->
      <g transform="translate(16, 64)">
        <!-- Iniciar (Active Primary) -->
        <g>
          <rect width="76" height="24" rx="5" fill="#0f172a"/>
          <polygon points="10,7 17,12 10,17" fill="#ffffff"/>
          <text x="22" y="16" font-size="11" font-weight="600" fill="#ffffff">Iniciar</text>
        </g>

        <!-- Detalhes -->
        <g transform="translate(216, 0)">
          <rect width="80" height="24" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
          <text x="40" y="16" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Detalhes</text>
        </g>
      </g>
    </g>

    <!-- Global Actions Section -->
    <g transform="translate(16, 305)">
      <line x1="0" y1="0" x2="328" y2="0" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Abrir Painel Completo Button -->
      <g transform="translate(0, 12)">
        <rect width="328" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
        <g transform="translate(85, 9)" fill="none" stroke="#0f172a" stroke-width="1.75">
          <rect x="2" y="2" width="14" height="12" rx="2"/>
          <line x1="2" y1="6" x2="16" y2="6"/>
        </g>
        <text x="110" y="22" font-size="12" font-weight="700" fill="#0f172a">Abrir Painel Completo</text>
      </g>

      <!-- Sair do Aplicativo -->
      <g transform="translate(0, 54)">
        <rect width="328" height="30" rx="8" fill="transparent"/>
        <text x="16" y="20" font-size="12" font-weight="500" fill="#64748b">Sair do Orquestrador Local</text>
        <text x="312" y="20" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">⌘Q</text>
      </g>
    </g>

    <!-- Watermark Strip -->
    <g transform="translate(16, 405)">
      <rect width="328" height="22" rx="4" fill="#f8fafc"/>
      <text x="164" y="15" font-size="9" font-weight="800" fill="#94a3b8" text-anchor="middle" letter-spacing="0.08em">CONCEITO / DADOS SINTÉTICOS</text>
    </g>
  </g>
</svg>
