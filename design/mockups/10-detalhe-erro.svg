<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="20" y="20" width="920" height="600" rx="16" ry="16" fill="#ffffff" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Top Navigation & Title Bar -->
  <rect x="20" y="20" width="920" height="52" rx="16" ry="16" fill="#f8fafc"/>
  <rect x="20" y="52" width="920" height="20" fill="#f8fafc"/>
  <line x1="20" y1="72" x2="940" y2="72" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Traffic Lights -->
  <circle cx="44" cy="46" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="64" cy="46" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="84" cy="46" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Back Button & Breadcrumbs -->
  <g transform="translate(120, 36)">
    <rect width="68" height="22" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <g transform="translate(6, 4)" fill="none" stroke="#0f172a" stroke-width="1.75">
      <polyline points="7 1 2 6 7 11"/>
      <line x1="3" y1="6" x2="12" y2="6"/>
    </g>
    <text x="22" y="15" font-size="11" font-weight="600" fill="#0f172a">Catálogo</text>
    <text x="78" y="15" font-size="12" font-weight="400" fill="#94a3b8">/</text>
    <text x="92" y="15" font-size="13" font-weight="700" fill="#0f172a">mflux-studio</text>
    <text x="175" y="15" font-size="12" font-weight="400" fill="#94a3b8">/</text>
    <text x="190" y="15" font-size="13" font-weight="700" fill="#dc2626">Diagnóstico de Falha</text>
  </g>

  <!-- Watermark in Top Right -->
  <g transform="translate(730, 40)">
    <rect width="190" height="20" rx="4" fill="#f1f5f9"/>
    <text x="95" y="14" font-size="9" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="0.06em">CONCEITO / DADOS SINTÉTICOS</text>
  </g>

  <!-- Error Header Alert Card -->
  <g transform="translate(50, 95)" filter="url(#cardShadow)">
    <rect width="850" height="90" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <path d="M 0 12 Q 0 0 12 0 L 12 90 Q 0 90 0 78 Z" fill="#dc2626"/>

    <g transform="translate(24, 20)" fill="none" stroke="#dc2626" stroke-width="2">
      <circle cx="14" cy="14" r="13" fill="#fee2e2"/>
      <line x1="14" y1="8" x2="14" y2="15"/>
      <circle cx="14" cy="19" r="1.5" fill="#dc2626"/>
    </g>

    <text x="64" y="34" font-size="16" font-weight="700" fill="#991b1b">Falha de Execução: O processo terminou inesperadamente (Código de saída: 1)</text>
    <text x="64" y="54" font-size="12" font-weight="400" fill="#7f1d1d">O supervisor detectou o encerramento do processo 4 segundos após o início via launchctl.</text>
    <text x="64" y="70" font-size="11" font-weight="500" fill="#dc2626">Horário exato da ocorrência: 2026-09-06 às 10:01:14 BRT (registro sintético)</text>
  </g>

  <!-- Error Log Box (Captured Stderr) -->
  <g transform="translate(50, 205)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#0f172a">Últimas Linhas do Log de Erro (stderr capturado via supervisor):</text>
    
    <g transform="translate(0, 12)">
      <rect width="850" height="150" rx="8" fill="#0f172a"/>
      
      <!-- Terminal Controls mini -->
      <circle cx="16" cy="16" r="4" fill="#ff5f56"/>
      <circle cx="28" cy="16" r="4" fill="#ffbd2e"/>
      <circle cx="40" cy="16" r="4" fill="#27c93f"/>
      <text x="60" y="19" font-size="10" font-family="ui-monospace, Menlo, monospace" fill="#64748b">mflux-studio.stderr.log</text>

      <!-- Code lines -->
      <g transform="translate(16, 44)" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#f8fafc">
        <text x="0" y="0" fill="#94a3b8">Traceback (most recent call last):</text>
        <text x="0" y="18" fill="#94a3b8">  File "/Users/joaopaulo/Documents/Projetos/mflux-studio/main.py", line 8, in &lt;module&gt;</text>
        <text x="0" y="36" fill="#94a3b8">    from mflux_backend.server import run_server</text>
        <text x="0" y="54" fill="#f87171" font-weight="700">ModuleNotFoundError: No module named 'mflux_backend'</text>
        <text x="0" y="76" fill="#fbbf24">[launchd] Service "local.mflux-studio" exited with code 1 (respawn throttled)</text>
      </g>
    </g>
  </g>

  <!-- Suggested Action in Plain Language -->
  <g transform="translate(50, 390)">
    <rect width="850" height="135" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <g transform="translate(24, 20)">
      <text x="0" y="0" font-size="14" font-weight="700" fill="#0f172a">Ação Sugerida pelo Orquestrador (Linguagem Clara):</text>
      
      <!-- Explanation step -->
      <text x="0" y="26" font-size="12" font-weight="400" fill="#64748b">O executável Python do supervisor não conseguiu encontrar a biblioteca 'mflux_backend'.</text>
      <text x="0" y="44" font-size="12" font-weight="400" fill="#64748b">Isto geralmente ocorre quando as dependências foram instaladas em outro ambiente virtual ou o caminho no plist está apontando para o Python global.</text>

      <!-- Checklist -->
      <g transform="translate(0, 60)">
        <circle cx="4" cy="4" r="3" fill="#059669"/>
        <text x="14" y="8" font-size="11" font-weight="600" fill="#0f172a">Passo 1:</text>
        <text x="64" y="8" font-size="11" fill="#64748b">Verifique se o ambiente virtual existe em: <tspan font-family="ui-monospace, Menlo, monospace">~/Documents/Projetos/mflux-studio/.venv</tspan></text>
      </g>

      <g transform="translate(0, 82)">
        <circle cx="4" cy="4" r="3" fill="#059669"/>
        <text x="14" y="8" font-size="11" font-weight="600" fill="#0f172a">Passo 2:</text>
        <text x="64" y="8" font-size="11" fill="#64748b">Execute no terminal do projeto: <tspan font-family="ui-monospace, Menlo, monospace">source .venv/bin/activate &amp;&amp; pip install -e .</tspan></text>
      </g>
    </g>
  </g>

  <!-- Action Buttons Row -->
  <g transform="translate(50, 545)">
    <!-- Reverificar Ambiente -->
    <rect width="170" height="34" rx="8" fill="#0f172a"/>
    <g transform="translate(14, 9)" fill="none" stroke="#ffffff" stroke-width="1.75">
      <path d="M12 2a10 10 0 1 1-7.07 2.93"/>
      <polyline points="5 2 5 7 10 7"/>
    </g>
    <text x="36" y="22" font-size="12" font-weight="600" fill="#ffffff">Reverificar Ambiente</text>

    <!-- Abrir Pasta do Projeto -->
    <g transform="translate(185, 0)">
      <rect width="180" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <g transform="translate(14, 9)" fill="none" stroke="#0f172a" stroke-width="1.75">
        <path d="M2 4h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
      </g>
      <text x="36" y="22" font-size="12" font-weight="600" fill="#0f172a">Abrir Pasta no Finder</text>
    </g>

    <!-- Voltar ao Catálogo -->
    <g transform="translate(730, 0)">
      <rect width="120" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="60" y="22" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Voltar ao Início</text>
    </g>
  </g>
</svg>
