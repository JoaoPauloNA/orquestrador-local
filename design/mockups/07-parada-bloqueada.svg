<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif">
  <defs>
    <filter id="backdropBlur">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="dialogShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Catalog (Blurred behind sheet) -->
  <g filter="url(#backdropBlur)" opacity="0.35">
    <rect x="20" y="20" width="920" height="600" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="50" y="80" width="200" height="30" rx="6" fill="#cbd5e1"/>
    <rect x="290" y="140" width="620" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="290" y="300" width="620" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>

  <!-- Dimmer Overlay -->
  <rect x="20" y="20" width="920" height="600" rx="16" fill="#0f172a" opacity="0.25"/>

  <!-- Stop Blocked Dialog / Sheet (Centering: 560 x 380) -->
  <g transform="translate(200, 130)" filter="url(#dialogShadow)">
    <rect width="560" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Warning Top Accent Strip -->
    <path d="M 0 16 Q 0 0 16 0 L 544 0 Q 560 0 560 16 L 560 24 L 0 24 Z" fill="#d97706"/>

    <!-- Watermark Badge -->
    <g transform="translate(360, 36)">
      <rect width="170" height="20" rx="4" fill="#fef3c7"/>
      <text x="85" y="14" font-size="8" font-weight="800" fill="#92400e" text-anchor="middle" letter-spacing="0.06em">CONCEITO / DADOS SINTÉTICOS</text>
    </g>

    <!-- Header Section with Warning Icon -->
    <g transform="translate(36, 44)">
      <g fill="none" stroke="#d97706" stroke-width="2">
        <circle cx="16" cy="16" r="15" fill="#fef3c7"/>
        <line x1="16" y1="9" x2="16" y2="17"/>
        <circle cx="16" cy="22" r="1.5" fill="#d97706"/>
      </g>
      <text x="44" y="18" font-size="16" font-weight="700" fill="#0f172a">Parada Bloqueada: Trabalho Ativo em Andamento</text>
      <text x="44" y="36" font-size="12" font-weight="400" fill="#64748b">O serviço 'mflux-studio' está executando tarefas e não pode ser interrompido agora.</text>
    </g>

    <line x1="36" y1="100" x2="524" y2="100" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Diagnostic Explanation Card -->
    <g transform="translate(36, 116)">
      <rect width="488" height="140" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      
      <text x="20" y="26" font-size="12" font-weight="700" fill="#0f172a">Detalhes da Atividade Detectada:</text>
      
      <!-- Bullet 1: Active Job -->
      <g transform="translate(20, 44)">
        <circle cx="4" cy="4" r="3" fill="#d97706"/>
        <text x="14" y="8" font-size="11" font-weight="600" fill="#0f172a">Tarefa de Inferência:</text>
        <text x="142" y="8" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#64748b">Lote #4829 (Passo 18 de 25 em progresso)</text>
      </g>

      <!-- Bullet 2: Client connection -->
      <g transform="translate(20, 70)">
        <circle cx="4" cy="4" r="3" fill="#d97706"/>
        <text x="14" y="8" font-size="11" font-weight="600" fill="#0f172a">Conexões HTTP Ativas:</text>
        <text x="156" y="8" font-size="11" fill="#64748b">1 cliente conectado via WebSocket na porta 8080</text>
      </g>

      <!-- Risk explanation -->
      <g transform="translate(20, 96)">
        <rect width="448" height="32" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
        <text x="12" y="20" font-size="11" font-weight="500" fill="#991b1b">Interromper o processo agora descartará tensores e causará perda do progresso não salvo.</text>
      </g>
    </g>

    <!-- Dialog Actions (NO FORCE KILL) -->
    <g transform="translate(36, 280)">
      <text x="0" y="16" font-size="11" font-weight="400" fill="#64748b">Aguarde o término da tarefa na interface web para parar o serviço com segurança.</text>

      <g transform="translate(0, 36)">
        <!-- Secondary: Abrir Interface para Acompanhar -->
        <g>
          <rect width="230" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
          <g transform="translate(14, 10)" fill="none" stroke="#0284c7" stroke-width="1.75">
            <path d="M10 7v4a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h4"/>
            <polyline points="8 2 12 2 12 6"/>
            <line x1="5" y1="9" x2="12" y2="2"/>
          </g>
          <text x="38" y="23" font-size="12" font-weight="600" fill="#0f172a">Acompanhar na Web</text>
        </g>

        <!-- Primary: Aguardar Conclusão (Dismiss modal safely) -->
        <g transform="translate(248, 0)">
          <rect width="240" height="36" rx="8" fill="#0f172a"/>
          <text x="120" y="23" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Aguardar Conclusão</text>
        </g>
      </g>
    </g>
  </g>
</svg>
