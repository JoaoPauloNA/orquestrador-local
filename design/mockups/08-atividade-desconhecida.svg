<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif">
  <defs>
    <filter id="backdropBlur">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="dialogShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Blurred Background -->
  <g filter="url(#backdropBlur)" opacity="0.35">
    <rect x="20" y="20" width="920" height="600" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="50" y="80" width="200" height="30" rx="6" fill="#cbd5e1"/>
    <rect x="290" y="140" width="620" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  </g>

  <!-- Dimmer Overlay -->
  <rect x="20" y="20" width="920" height="600" rx="16" fill="#0f172a" opacity="0.25"/>

  <!-- Centered Modal Dialog (560 x 400) -->
  <g transform="translate(200, 120)" filter="url(#dialogShadow)">
    <rect width="560" height="400" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Neutral/Slate Top Accent Strip -->
    <path d="M 0 16 Q 0 0 16 0 L 544 0 Q 560 0 560 16 L 560 24 L 0 24 Z" fill="#64748b"/>

    <!-- Watermark Badge -->
    <g transform="translate(360, 36)">
      <rect width="170" height="20" rx="4" fill="#f1f5f9"/>
      <text x="85" y="14" font-size="8" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="0.06em">CONCEITO / DADOS SINTÉTICOS</text>
    </g>

    <!-- Header with Question / Alert Icon -->
    <g transform="translate(36, 44)">
      <g fill="none" stroke="#64748b" stroke-width="2">
        <circle cx="16" cy="16" r="15" fill="#f1f5f9"/>
        <circle cx="16" cy="16" r="1"/>
        <path d="M13 12a3 3 0 0 1 5.5 1.5c0 1.5-2 2-2 2.5"/>
        <line x1="16" y1="21" x2="16.01" y2="21"/>
      </g>
      <text x="44" y="18" font-size="16" font-weight="700" fill="#0f172a">Atividade Desconhecida: Confirmação do Operador</text>
      <text x="44" y="36" font-size="12" font-weight="400" fill="#64748b">O serviço 'ComfyUI' não expõe telemetria de atividade ou status de fila.</text>
    </g>

    <line x1="36" y1="100" x2="524" y2="100" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Explanation Box -->
    <g transform="translate(36, 116)">
      <rect width="488" height="130" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      
      <text x="20" y="24" font-size="12" font-weight="700" fill="#0f172a">Por que esta confirmação é necessária?</text>
      <text x="20" y="44" font-size="11" font-weight="400" fill="#64748b">O endpoint configurado responde apenas à checagem de porta viva, mas não</text>
      <text x="20" y="60" font-size="11" font-weight="400" fill="#64748b">informa se há fluxos de trabalho (workflows) de geração de imagem em execução.</text>
      
      <g transform="translate(20, 78)">
        <rect width="448" height="38" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
        <text x="12" y="16" font-size="11" font-weight="600" fill="#92400e">Recomendação do Sistema:</text>
        <text x="12" y="30" font-size="10" font-weight="400" fill="#92400e">Acesse a aba do ComfyUI no navegador para garantir que a fila (Queue) esteja vazia.</text>
      </g>
    </g>

    <!-- Checkbox confirmation section -->
    <g transform="translate(36, 266)">
      <!-- Interactive Checkbox -->
      <rect width="20" height="20" rx="5" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
      <polyline points="4 10 8 14 16 6" fill="none" stroke="#0f172a" stroke-width="2"/>
      
      <text x="30" y="15" font-size="12" font-weight="600" fill="#0f172a">Confirmo que o serviço está ocioso e pode ser encerrado com segurança.</text>
      <text x="30" y="32" font-size="10" font-weight="400" fill="#64748b">Ao marcar, o orquestrador enviará um sinal SIGTERM suave para encerramento gracioso.</text>
    </g>

    <!-- Actions Row -->
    <g transform="translate(36, 325)">
      <line x1="0" y1="0" x2="488" y2="0" stroke="#f1f5f9" stroke-width="1"/>

      <!-- Cancelar -->
      <g transform="translate(0, 16)">
        <rect width="110" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="55" y="23" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Cancelar</text>
      </g>

      <!-- Abrir Interface Primeiro -->
      <g transform="translate(120, 16)">
        <rect width="200" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="100" y="23" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Abrir Web para Checar</text>
      </g>

      <!-- Parar Serviço (Enabled because checkbox is marked) -->
      <g transform="translate(330, 16)">
        <rect width="158" height="36" rx="8" fill="#dc2626"/>
        <text x="79" y="23" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Confirmar e Parar</text>
      </g>
    </g>
  </g>
</svg>
