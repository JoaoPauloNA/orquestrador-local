<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="20" y="20" width="920" height="600" rx="16" ry="16" fill="#ffffff" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Left Sidebar (Width: 240) -->
  <rect x="20" y="20" width="240" height="600" rx="16" ry="16" fill="#f8fafc"/>
  <rect x="240" y="20" width="20" height="600" fill="#f8fafc"/>
  <line x1="260" y1="20" x2="260" y2="620" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="44" cy="44" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="64" cy="44" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="84" cy="44" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Brand in Sidebar -->
  <g transform="translate(40, 80)">
    <circle cx="12" cy="12" r="12" fill="#0f172a"/>
    <circle cx="12" cy="12" r="4" fill="#059669"/>
    <text x="32" y="16" font-size="14" font-weight="700" fill="#0f172a">Orquestrador</text>
    <text x="124" y="16" font-size="11" font-weight="700" fill="#059669">LOCAL</text>
  </g>

  <!-- Sidebar Nav (Empty counts) -->
  <g transform="translate(32, 130)">
    <rect x="0" y="0" width="216" height="36" rx="8" fill="#e2e8f0" opacity="0.7"/>
    <g transform="translate(12, 10)" fill="none" stroke="#0f172a" stroke-width="1.75">
      <rect x="2" y="2" width="5" height="5" rx="1"/>
      <rect x="9" y="2" width="5" height="5" rx="1"/>
      <rect x="2" y="9" width="5" height="5" rx="1"/>
      <rect x="9" y="9" width="5" height="5" rx="1"/>
    </g>
    <text x="36" y="23" font-size="13" font-weight="600" fill="#0f172a">Catálogo de Serviços</text>
    <rect x="186" y="9" width="20" height="18" rx="9" fill="#94a3b8"/>
    <text x="196" y="22" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">0</text>
  </g>

  <!-- Empty State Main Stage -->
  <g transform="translate(400, 160)">
    <!-- Abstract Technical Empty Illustration (Concentric nodes awaiting configuration) -->
    <g transform="translate(100, 0)">
      <circle cx="90" cy="70" r="64" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>
      <circle cx="90" cy="70" r="44" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="90" cy="70" r="28" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      
      <!-- Plus Node in center -->
      <g fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round">
        <line x1="90" y1="58" x2="90" y2="82"/>
        <line x1="78" y1="70" x2="102" y2="70"/>
      </g>
    </g>

    <!-- Content Group -->
    <g transform="translate(0, 170)" text-anchor="middle">
      <text x="190" y="0" font-size="20" font-weight="700" fill="#0f172a">Nenhum serviço configurado</text>
      <text x="190" y="26" font-size="13" font-weight="400" fill="#64748b">O Orquestrador Local gerencia seus serviços de IA e servidores locais com</text>
      <text x="190" y="44" font-size="13" font-weight="400" fill="#64748b">controle determinístico de início, prontidão e encerramento seguro.</text>

      <!-- Primary Action CTA -->
      <g transform="translate(90, 75)">
        <rect width="200" height="40" rx="10" fill="#0f172a"/>
        <g transform="translate(18, 12)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
          <line x1="8" y1="2" x2="8" y2="14"/>
          <line x1="2" y1="8" x2="14" y2="8"/>
        </g>
        <text x="42" y="25" font-size="13" font-weight="600" fill="#ffffff" text-anchor="start">Cadastrar Primeiro Serviço</text>
      </g>

      <!-- Secondary Action CTA -->
      <g transform="translate(115, 130)">
        <rect width="150" height="30" rx="6" fill="transparent"/>
        <text x="75" y="20" font-size="12" font-weight="600" fill="#0284c7">Consultar Documentação</text>
      </g>
    </g>
  </g>

  <!-- Watermark Bar -->
  <g transform="translate(290, 585)">
    <rect width="630" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="14" cy="12" r="3" fill="#d97706"/>
    <text x="26" y="16" font-size="10" font-weight="800" fill="#64748b" letter-spacing="0.08em">CONCEITO / DADOS SINTÉTICOS</text>
    <text x="618" y="16" font-size="10" font-weight="500" fill="#94a3b8" text-anchor="end">Estado Inicial sem Persistência Prévia</text>
  </g>
</svg>
