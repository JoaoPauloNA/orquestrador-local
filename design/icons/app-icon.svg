<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Metallic Edge Ring -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Green Core Gradient -->
    <linearGradient id="greenPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="macAppShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Core Glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- macOS Continuous Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bgGrad)" filter="url(#macAppShadow)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Subtle Radial Ambient Light inside the container -->
  <radialGradient id="innerGlow" cx="50%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#innerGlow)"/>

  <!-- Concentric Orbital Grid (Orchestration Geometry) -->
  <!-- Outer Monitoring Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 8" opacity="0.6"/>
  
  <!-- Secondary Control Ring -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#475569" stroke-width="2.5" opacity="0.4"/>

  <!-- Active Supervisor Arc (Gold - State Transition & Supervision) -->
  <path d="M 256 96 A 160 160 0 0 1 416 256" fill="none" stroke="url(#goldArc)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Healthy Loop Arc (Green - Readiness & Healthcheck) -->
  <path d="M 256 416 A 160 160 0 0 1 96 256" fill="none" stroke="url(#greenPulse)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Central Orchestration Core (Hexagonal Container) -->
  <g transform="translate(256, 256)">
    <!-- Base Hexagon Background -->
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    
    <!-- Node Connection Rays -->
    <line x1="0" y1="-72" x2="0" y2="-110" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <line x1="62" y1="36" x2="98" y2="58" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <line x1="-62" y1="36" x2="-98" y2="58" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- Orbital Satellites (Managed Services) -->
    <circle cx="0" cy="-114" r="7" fill="#fbbf24"/>
    <circle cx="102" cy="60" r="7" fill="#10b981"/>
    <circle cx="-102" cy="60" r="7" fill="#38bdf8"/>

    <!-- Inner Core: Status Nucleus -->
    <circle cx="0" cy="0" r="38" fill="url(#greenPulse)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="28" fill="#020617"/>
    
    <!-- Core Status Node (Steady Green Signal) -->
    <circle cx="0" cy="0" r="14" fill="#34d399"/>
  </g>

  <!-- Technical Corner Registration Markers (macOS Precision Utility Accent) -->
  <path d="M 92 84 L 84 84 L 84 92" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 420 84 L 428 84 L 428 92" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 84 420 L 84 428 L 92 428" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 428 420 L 428 428 L 420 428" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
