# Declarative, local-only service catalog. Existing LaunchAgents are read and
# validated; this file never writes or replaces a plist.
screenpipe:
  name: ScreenPipe
  label: com.joaopaulo.screenpipe
  plist_path: /Users/joaopaulo/Library/LaunchAgents/com.joaopaulo.screenpipe.plist
  executable_path: /Users/joaopaulo/.local/bin/screenpipe-orquestrador
